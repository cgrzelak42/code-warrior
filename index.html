<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Code Warrior</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: sticky command bar, rail nav on the left (bottom tabs on phones), content column of sharp clipped-corner panels on a deep indigo field */
:root{
  --ink:#100E26;      /* page */
  --panel:#1B1840;    /* cards */
  --panel-2:#272259;  /* raised / hover */
  --well:#0A0920;     /* code + console */
  --line:#3A3478;
  --text:#F4F1FF;
  --muted:#ABA4DA;
  --dim:#7770B0;
  --coral:#FF4F79;    /* primary action, brand */
  --sun:#FFC53D;      /* XP, streak, hints */
  --cyan:#2FE3CF;     /* run, success */
  --violet:#9B7BFF;   /* secondary data */
  --danger:#FF7262;
  --on-coral:#FFFFFF;
  --on-sun:#2B1D00;
  --on-cyan:#03231F;
  --t-kw:#FF7FA2; --t-str:#FFD36B; --t-num:#7CF3E4; --t-fn:#BFA8FF; --t-com:#6F69AA; --t-const:#2FE3CF;
  --f-display:"Chakra Petch","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,sans-serif;
  --f-code:"JetBrains Mono",ui-monospace,Consolas,"Courier New",monospace;
  --cut:14px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--ink)}
body{
  background:
    radial-gradient(900px 500px at 90% -10%, rgba(255,79,121,.16), transparent 60%),
    radial-gradient(700px 500px at -10% 110%, rgba(47,227,207,.10), transparent 60%),
    var(--ink);
  background-attachment:fixed;
  color:var(--text);font-family:var(--f-body);font-size:15px;line-height:1.55;min-height:100%;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--ink)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.cut{clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%,0 var(--cut))}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(28px,4vw,40px);letter-spacing:.01em}
h2{font-size:20px;letter-spacing:.02em}
p{margin:0}
code{font-family:var(--f-code);font-size:.92em;background:var(--panel-2);padding:1px 6px;color:var(--t-str)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
.eyebrow,.label{font-family:var(--f-display);font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lede{color:var(--muted);font-size:17px;max-width:62ch}
.dim{color:var(--dim)}
svg.i{width:18px;height:18px;flex:none}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:rgba(16,14,38,.86);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.topbar-in{display:flex;align-items:center;gap:12px;height:62px;max-width:1240px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:.08em;text-transform:uppercase;background:none;border:0;cursor:pointer;padding:0}
.brand b{color:var(--coral);font-weight:700}
.mark{width:32px;height:32px;display:grid;place-items:center;background:var(--coral);color:var(--on-coral);font:700 14px var(--f-code);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.chips{margin-left:auto;display:flex;gap:8px}
.chip{display:flex;align-items:center;gap:6px;padding:6px 12px;background:var(--panel);border:1px solid var(--line);font:700 15px var(--f-display);font-variant-numeric:tabular-nums;white-space:nowrap}
.chip .cl{font-weight:500;color:var(--muted);font-size:13px}
.chip.st svg{color:var(--sun)} .chip.xp svg{color:var(--cyan)}
.chip.lv{background:var(--coral);border-color:var(--coral);color:var(--on-coral)}

/* layout */
.layout{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:196px minmax(0,1fr);gap:32px;padding-block:28px 64px}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 90px);align-self:start;display:flex;flex-direction:column;gap:4px}
.navbtn{display:flex;align-items:center;gap:12px;padding:12px 14px;background:transparent;border:0;color:var(--muted);font:600 15px var(--f-body);cursor:pointer;text-align:left;clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
.navbtn:hover{color:var(--text);background:var(--panel)}
.navbtn[aria-current="page"]{background:var(--panel-2);color:var(--text)}
.navbtn[aria-current="page"] svg{color:var(--coral)}
.sync{margin-top:18px;padding:12px 14px;font-size:12.5px;color:var(--dim);border-top:1px solid var(--line);line-height:1.45}
main{min-width:0;outline:none}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;font:700 14px var(--f-display);letter-spacing:.08em;text-transform:uppercase;border:0;cursor:pointer;clip-path:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px);transition:transform .12s ease,filter .12s ease}
.btn:hover{filter:brightness(1.1)} .btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:none;box-shadow:inset 0 0 0 3px var(--text)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--coral);color:var(--on-coral)}
.btn-run{background:var(--cyan);color:var(--on-cyan)}
.btn-stuck{background:var(--sun);color:var(--on-sun)}
.btn-ghost{background:var(--panel-2);color:var(--text)}
.btn.sm{padding:8px 12px;font-size:12px}
.link{background:none;border:0;padding:0;color:var(--muted);cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.link:hover{color:var(--text)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;font:700 11px var(--f-display);letter-spacing:.1em;text-transform:uppercase;background:var(--panel-2);color:var(--muted)}
.pill.ok{background:rgba(47,227,207,.14);color:var(--cyan)}
.pill.next{background:rgba(255,197,61,.14);color:var(--sun)}
.pill.d-Easy{background:rgba(47,227,207,.14);color:var(--cyan)}
.pill.d-Medium{background:rgba(255,197,61,.14);color:var(--sun)}
.pill.d-Hard{background:rgba(255,79,121,.16);color:var(--coral)}

/* cards */
.card{background:var(--panel);border:1px solid var(--line);padding:22px;min-width:0;display:flex;flex-direction:column;gap:16px}
.card-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}

/* dashboard */
.dash{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:18px}
.s12{grid-column:span 12}.s7{grid-column:span 7}.s5{grid-column:span 5}
.hero{grid-column:span 12;display:flex;gap:28px;align-items:center;padding:30px;background:linear-gradient(120deg,var(--panel-2),var(--panel) 70%);border:1px solid var(--line);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:260px;height:260px;background:repeating-linear-gradient(135deg,rgba(255,79,121,.14) 0 2px,transparent 2px 14px);pointer-events:none}
.hero-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px;position:relative;z-index:1}
.xpbar{height:16px;background:var(--well);border:1px solid var(--line);position:relative;overflow:hidden;margin-top:8px}
.xpbar span{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--coral),var(--sun));transition:width .8s cubic-bezier(.2,.8,.2,1)}
.xpbar::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 2px),var(--well) calc(10% - 2px) 10%)}
.xpmeta{display:flex;justify-content:space-between;gap:12px;font:600 13px var(--f-display);letter-spacing:.06em;color:var(--muted);font-variant-numeric:tabular-nums;flex-wrap:wrap}
.xpmeta b{color:var(--sun)}
.emblem{display:flex;flex-direction:column;align-items:center;gap:10px;position:relative;z-index:1;flex:none}
.emblem-shape{width:118px;height:118px;display:grid;place-items:center;background:linear-gradient(160deg,var(--coral),#B8245A);clip-path:polygon(50% 0,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%)}
.emblem-lv{font:700 46px var(--f-display);color:var(--on-coral);line-height:1}
.emblem-lv small{display:block;font-size:11px;letter-spacing:.2em;text-align:center;opacity:.85}
.emblem-rank{font:700 15px var(--f-display);letter-spacing:.18em;text-transform:uppercase;color:var(--sun)}

.streak-big{display:flex;align-items:center;gap:12px}
.streak-big svg{width:46px;height:46px;color:var(--sun);filter:drop-shadow(0 0 14px rgba(255,197,61,.45))}
.streak-big .n{font:700 56px/1 var(--f-display);color:var(--text);font-variant-numeric:tabular-nums}
.streak-big .u{color:var(--muted);font-weight:600;max-width:9ch;line-height:1.25}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.day{display:flex;flex-direction:column;align-items:center;gap:6px}
.day .dl{font:600 11px var(--f-display);letter-spacing:.1em;color:var(--dim)}
.day .dot{width:100%;max-width:44px;aspect-ratio:1;display:grid;place-items:center;background:var(--well);border:1px solid var(--line);clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px)}
.day.on .dot{background:var(--sun);border-color:var(--sun);color:var(--on-sun)}
.day.on .dot svg{width:55%;height:55%}
.day.today .dl{color:var(--text)}
.day.today:not(.on) .dot{border-color:var(--sun);border-style:dashed}
.mbar{height:8px;background:var(--well);border:1px solid var(--line);position:relative;overflow:hidden}
.mbar span{position:absolute;inset:0 auto 0 0;background:var(--sun)}
.milestone p{margin-top:8px;font-size:13.5px;color:var(--muted)}

.prog-wrap{display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.ring{position:relative;width:132px;height:132px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .rv{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .rv b{font:700 30px/1 var(--f-display)}
.ring .rv span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-family:var(--f-display)}
.prows{flex:1;min-width:200px;display:flex;flex-direction:column;gap:14px}
.prow-top{display:flex;justify-content:space-between;font-weight:600;font-size:14px;margin-bottom:6px}
.prow-top span:last-child{font-variant-numeric:tabular-nums;color:var(--muted)}
.pbar{height:8px;background:var(--well);position:relative;overflow:hidden}
.pbar span{position:absolute;inset:0 auto 0 0;transition:width .8s cubic-bezier(.2,.8,.2,1)}

.next-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{display:flex;flex-direction:column;gap:8px;text-align:left;padding:18px;background:var(--panel-2);border:0;cursor:pointer;min-width:0;transition:transform .15s ease}
.tile:hover{transform:translateY(-2px)}
.tile .tt{font:700 18px var(--f-display)}
.tile .ts{color:var(--muted);font-size:14px}
.tile .go{margin-top:auto;display:flex;align-items:center;gap:6px;font:700 13px var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--coral)}

.acts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.acts li{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.acts li:last-child{border-bottom:0}
.acts .ai{width:28px;height:28px;display:grid;place-items:center;flex:none;background:var(--panel-2)}
.acts .ai svg{width:15px;height:15px}
.acts .at{color:var(--dim);font-size:12.5px;display:block}
.k-lesson .ai{color:var(--coral)} .k-challenge .ai{color:var(--cyan)} .k-streak .ai{color:var(--sun)} .k-level .ai{color:var(--violet)}

.badges{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:12px}
.badge{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.badge .bs{width:64px;height:72px;display:grid;place-items:center;clip-path:polygon(50% 0,100% 22%,100% 70%,50% 100%,0 70%,0 22%);background:var(--well);color:var(--dim)}
.badge .bs svg{width:28px;height:28px}
.badge.got .bs{background:linear-gradient(160deg,var(--sun),#F08A1C);color:var(--on-sun)}
.badge .bn{font:700 13px var(--f-display);letter-spacing:.04em}
.badge .bd{font-size:12px;color:var(--dim);line-height:1.35}
.badge:not(.got) .bn{color:var(--muted)}

/* list pages */
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:26px;flex-wrap:wrap}
.page-head > div:first-child{display:flex;flex-direction:column;gap:10px;min-width:0}
.head-stat{display:flex;flex-direction:column;align-items:flex-end}
.head-stat .n{font:700 38px/1 var(--f-display);color:var(--sun);font-variant-numeric:tabular-nums}
.head-stat span:last-child{font-size:13px;color:var(--muted)}
.lesson-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.lesson-card{display:flex;gap:18px;align-items:flex-start;text-align:left;padding:20px;background:var(--panel);border:0;cursor:pointer;min-width:0;transition:background .15s ease,transform .15s ease}
.lesson-card:hover{background:var(--panel-2);transform:translateY(-2px)}
.lnum{font:700 40px/1 var(--f-display);color:var(--line);font-variant-numeric:tabular-nums;flex:none;min-width:2ch}
.lesson-card.done .lnum{color:var(--cyan)}
.lesson-card.upnext .lnum{color:var(--coral)}
.lbody{display:flex;flex-direction:column;gap:6px;min-width:0}
.ltitle{font:700 18px var(--f-display)}
.lsum{color:var(--muted);font-size:14px}
.lmeta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:4px}

.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.fbtn{padding:8px 14px;background:var(--panel);border:1px solid var(--line);color:var(--muted);font:600 13px var(--f-display);letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.fbtn[aria-pressed="true"]{background:var(--text);color:var(--ink);border-color:var(--text)}
.ch-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.ch-card{display:flex;flex-direction:column;gap:10px;text-align:left;padding:20px;background:var(--panel);border:0;cursor:pointer;min-width:0;position:relative;transition:background .15s ease,transform .15s ease}
.ch-card:hover{background:var(--panel-2);transform:translateY(-2px)}
.ch-card .ct{font:700 19px var(--f-display)}
.ch-card .cb{color:var(--muted);font-size:14px}
.ch-card .cf{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:8px;padding-top:8px}
.ch-card .xpv{font:700 14px var(--f-display);color:var(--sun);display:flex;align-items:center;gap:4px}
.ch-card.solved{background:linear-gradient(160deg,rgba(47,227,207,.10),var(--panel) 55%)}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font:500 12px var(--f-code);color:var(--dim)}

/* lesson + challenge pages */
.crumbs{margin-bottom:18px}
.lesson-head{display:flex;flex-direction:column;gap:12px;margin-bottom:28px}
.lesson-sec{display:flex;flex-direction:column;gap:12px;padding-block:22px;border-top:1px solid var(--line)}
.prose{display:flex;flex-direction:column;gap:12px;max-width:68ch;color:var(--text)}
.prose ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.prose strong{color:var(--text)}
.target{font:600 16px var(--f-code);color:var(--sun);background:var(--well);padding:10px 14px;border-left:3px solid var(--sun);overflow-x:auto;white-space:pre}
.tbl{overflow-x:auto}
.ops{border-collapse:collapse;font-size:14px}
.ops td{padding:7px 14px 7px 0;border-bottom:1px solid var(--line)}
.ops td:nth-child(odd){padding-right:8px}
.example{display:flex;flex-direction:column;gap:10px;max-width:760px}
.hint-text{color:var(--dim);font-size:13px}
.exercise{background:var(--panel);border:1px solid var(--line);padding:24px;display:flex;flex-direction:column;gap:14px;margin-top:8px}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:28px;flex-wrap:wrap}

.ch-layout{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:26px;align-items:start}
.ch-brief{display:flex;flex-direction:column;gap:16px;min-width:0}
.ch-work{display:flex;flex-direction:column;gap:12px;min-width:0}
.term{display:flex;flex-direction:column}
.term .console{border-top:1px dashed var(--line)}
.term .editor + .console{margin-top:-1px}
.work-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sample{margin:0;font:13.5px/1.6 var(--f-code);background:var(--well);border:1px solid var(--line);padding:12px 14px;overflow-x:auto;color:var(--text)}
.reward{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--well);border:1px solid var(--line)}
.reward svg{color:var(--sun);width:26px;height:26px}
.reward strong{font:700 22px var(--f-display);color:var(--sun);font-variant-numeric:tabular-nums}
.reward small{display:block;color:var(--dim);font-size:12.5px;line-height:1.4}

/* editor */
.editor{display:grid;grid-template-columns:auto minmax(0,1fr);background:var(--well);border:1px solid var(--line);font:14px/1.6 var(--f-code);transition:border-color .15s ease}
.editor:focus-within{border-color:var(--violet)}
.gutter{padding:12px 10px 12px 14px;color:var(--t-com);text-align:right;user-select:none;-webkit-user-select:none;white-space:pre;border-right:1px solid var(--line);font-variant-numeric:tabular-nums}
.code-wrap{position:relative;min-width:0}
.code-wrap pre,.code-wrap textarea{margin:0;padding:12px 14px;font:inherit;line-height:inherit;white-space:pre;tab-size:4;letter-spacing:0;word-spacing:0;border:0}
.code-wrap pre{position:absolute;inset:0;overflow:hidden;pointer-events:none;color:var(--text)}
.code-wrap textarea{display:block;width:100%;resize:none;background:transparent;color:transparent;caret-color:var(--sun);outline:none;overflow-x:auto;overflow-y:hidden;-webkit-text-fill-color:transparent}
.code-wrap textarea::selection{background:rgba(155,123,255,.4)}
.t-kw{color:var(--t-kw)}.t-str{color:var(--t-str)}.t-num{color:var(--t-num)}.t-fn{color:var(--t-fn)}.t-com{color:var(--t-com);font-style:italic}.t-const{color:var(--t-const)}
.code-static{margin:0;font:13.5px/1.6 var(--f-code);background:var(--well);padding:12px 14px;overflow-x:auto;color:var(--text);white-space:pre}
.console{margin:0;background:var(--well);border:1px solid var(--line);font:13.5px/1.6 var(--f-code);padding:12px 14px;min-height:64px;max-height:300px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--text)}
.console .err{color:var(--danger);font-weight:600}
.console .tip{display:block;margin-top:10px;padding:10px 12px;background:var(--panel);color:var(--muted);font-family:var(--f-body);font-size:14px;white-space:normal}
.console .tip b{color:var(--sun)}

/* results + hints */
.result{display:flex;gap:14px;align-items:flex-start;padding:16px 18px;border:1px solid var(--line);background:var(--panel)}
.result .ri{width:36px;height:36px;display:grid;place-items:center;flex:none}
.result.win{border-color:var(--cyan);background:linear-gradient(120deg,rgba(47,227,207,.16),var(--panel) 70%)}
.result.win .ri{background:var(--cyan);color:var(--on-cyan)}
.result.miss{border-color:var(--danger)}
.result.miss .ri{background:var(--danger);color:var(--ink)}
.result .rb{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.result strong{font:700 18px var(--f-display)}
.result .xpg{color:var(--sun);font:700 15px var(--f-display)}
.diff{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:6px}
.diff pre{margin:4px 0 0;font:13px/1.55 var(--f-code);background:var(--well);padding:10px 12px;overflow-x:auto;white-space:pre}

const LESSONS = [
{ id:'hello', title:'Hello, Python', topic:'print()', summary:'Write your first line of code and make the computer talk back.',
  sections:[
    { h:'Your first instruction', p:`<p>A program is a list of instructions that the computer follows from top to bottom. The simplest instruction in Python is <code>print()</code>. Whatever you put between the parentheses shows up on the screen.</p>`,
      code:`print("Hello, warrior!")` },
    { h:'Text goes in quotes', p:`<p>Text in Python is called a <strong>string</strong>. Wrap it in double quotes <code>"like this"</code> or single quotes <code>'like this'</code>. Numbers don't need quotes, and Python can do math right inside <code>print()</code>.</p>`,
      code:`print("I am learning Python")
print(42)
print(7 + 3)` },
    { h:'Notes for humans', p:`<p>Any line that starts with <code>#</code> is a <strong>comment</strong>. Python skips it. Use comments to leave notes for yourself and for anyone who reads your code.</p>`,
      code:`# This line is a note. Python ignores it.
print("This line runs")` }
  ],
  ex:{ title:'Report for duty', prompt:`<p>Print exactly this message, including the comma and the exclamation mark:</p><p class="target">Code Warrior, reporting for duty!</p>`,
    starter:`# Write your print() below
`, check:{type:'output', expect:'Code Warrior, reporting for duty!'},
    hints:[`Start with <code>print(</code>, put your message inside quotes, then close with <code>)</code>.`,
           `Capital letters and punctuation must match exactly, including the comma after <code>Warrior</code>.`],
    solution:`print("Code Warrior, reporting for duty!")` } },

{ id:'variables', title:'Variables', topic:'name = value', summary:'Store information in labeled boxes so you can use it later.',
  sections:[
    { h:'Labeled boxes', p:`<p>A <strong>variable</strong> is a name that holds a value. You create one with an equals sign: the name goes on the left, the value on the right. After that, you can use the name anywhere you would use the value.</p>`,
      code:`hero = "Ada"
level = 3
print(hero)
print(level)` },
    { h:'Changing a value', p:`<p>Variables can change. Python works out the right side first, then stores the result in the name on the left. So <code>gold = gold + 5</code> means "take the current gold, add 5, and save it back."</p>`,
      code:`gold = 10
print(gold)
gold = gold + 5
print(gold)` },
    { h:'Types of values', p:`<p>Every value has a <strong>type</strong>. Whole numbers are <code>int</code>, numbers with a decimal point are <code>float</code>, and text is <code>str</code>. Notice that <code>"3"</code> in quotes is text, not a number.</p>`,
      code:`print(type(3))
print(type(3.5))
print(type("3"))` },
    { h:'Naming rules', p:`<p>Names can use letters, numbers and underscores, but they can't start with a number or contain spaces. Python programmers write names in lowercase with underscores, like <code>max_health</code>. Names are case-sensitive, so <code>Gold</code> and <code>gold</code> are two different variables.</p>` }
  ],
  ex:{ title:'Arm yourself', prompt:`<p>Create a variable called <code>weapon</code> that holds the text <code>"sword"</code>, then print it.</p>`,
    starter:`# Create weapon here
`, check:{type:'test', code:`assert weapon == "sword", 'weapon should hold the text "sword"'`},
    hints:[`Variables are created with <code>=</code>: the name on the left, the value on the right.`,
           `Text needs quotes: <code>weapon = "sword"</code>. Then print the variable name <em>without</em> quotes so Python prints its value.`],
    solution:`weapon = "sword"
print(weapon)` } },

{ id:'math', title:'Math & Operators', topic:'+ - * / // %', summary:'Turn Python into a calculator for damage, gold and scores.',
  sections:[
    { h:'The operators', p:`<p>Python knows all the usual math, plus a few extras that come up all the time in games and puzzles.</p>
<div class="tbl"><table class="ops"><tr><td><code>+</code></td><td>add</td><td><code>//</code></td><td>divide and drop the remainder</td></tr><tr><td><code>-</code></td><td>subtract</td><td><code>%</code></td><td>the remainder after dividing</td></tr><tr><td><code>*</code></td><td>multiply</td><td><code>**</code></td><td>power</td></tr><tr><td><code>/</code></td><td>divide</td><td></td><td></td></tr></table></div>`,
      code:`print(7 + 2)
print(7 - 2)
print(7 * 2)
print(7 / 2)
print(7 // 2)
print(7 % 2)
print(2 ** 3)` },
    { h:'Order of operations', p:`<p>Multiplication and division happen before addition and subtraction, just like in math class. Use parentheses to choose the order yourself.</p>`,
      code:`print(2 + 3 * 4)
print((2 + 3) * 4)` },
    { h:'Math with variables', p:`<p>Variables and math work together. This is how games keep track of health, scores and money.</p>`,
      code:`hp = 100
damage = 35
hp = hp - damage
print(hp)` }
  ],
  ex:{ title:'Slay the dragon', prompt:`<p>A dragon has <code>120</code> HP and each sword hit does <code>15</code> damage. Store the number of hits needed in a variable called <code>hits</code>, working it out with math from the two variables. Then print it.</p>`,
    starter:`dragon_hp = 120
sword_damage = 15

# Calculate hits here
`, check:{type:'test', code:`assert hits == 8, "hits should be 8"`},
    hints:[`How many times does 15 fit into 120? That's a division.`,
           `<code>//</code> divides and gives back a whole number. Divide <code>dragon_hp</code> by <code>sword_damage</code> and store it in <code>hits</code>.`],
    solution:`dragon_hp = 120
sword_damage = 15

hits = dragon_hp // sword_damage
print(hits)` } },

{ id:'strings', title:'Working with Text', topic:'f-strings', summary:'Join, measure and reshape strings, and drop variables into text.',
  sections:[
    { h:'Joining strings', p:`<p>You can glue strings together with <code>+</code>. Add a space yourself if you want one. You can only join text to text, so turn numbers into text first with <code>str()</code>.</p>`,
      code:`first = "Ada"
last = "Lovelace"
print(first + " " + last)
print("Level " + str(5))` },
    { h:'f-strings', p:`<p>An <strong>f-string</strong> is the easiest way to mix variables into text. Put an <code>f</code> right before the opening quote, then write variable names inside curly braces <code>{ }</code>.</p>`,
      code:`name = "Ada"
gold = 42
print(f"{name} has {gold} gold")` },
    { h:'Useful string tools', p:`<p><code>len()</code> counts characters. <code>.upper()</code> and <code>.lower()</code> change the case. Square brackets grab one character by its position, and positions start at <strong>0</strong>. <code>[-1]</code> means the last character.</p>`,
      code:`word = "python"
print(len(word))
print(word.upper())
print(word[0])
print(word[-1])` }
  ],
  ex:{ title:'Hero name tag', prompt:`<p>Use an f-string and the two variables to print exactly:</p><p class="target">Ada is level 5</p>`,
    starter:`name = "Ada"
level = 5

`, check:{type:'output', expect:'Ada is level 5'},
    hints:[`Start with <code>print(f"...")</code>. The <code>f</code> goes right before the opening quote.`,
           `Inside the quotes, put each variable in curly braces: <code>{name}</code> and <code>{level}</code>, with the words " is level " between them.`],
    solution:`name = "Ada"
level = 5

print(f"{name} is level {level}")` } },

{ id:'conditions', title:'Making Decisions', topic:'if / elif / else', summary:'Let your program choose what to do based on what is true.',
  sections:[
    { h:'Comparisons', p:`<p>A comparison asks a yes-or-no question and gives back <code>True</code> or <code>False</code>. Watch the double equals: <code>=</code> stores a value, while <code>==</code> compares two values.</p>
<div class="tbl"><table class="ops"><tr><td><code>==</code></td><td>equal to</td><td><code>!=</code></td><td>not equal to</td></tr><tr><td><code>&gt;</code></td><td>greater than</td><td><code>&lt;</code></td><td>less than</td></tr><tr><td><code>&gt;=</code></td><td>greater than or equal</td><td><code>&lt;=</code></td><td>less than or equal</td></tr></table></div>`,
      code:`hp = 40
print(hp > 50)
print(hp == 40)
print(hp != 40)` },
    { h:'if and else', p:`<p>An <code>if</code> statement runs a block of code only when its condition is true. The line ends with a colon <code>:</code>, and the code inside is <strong>indented by 4 spaces</strong>. An <code>else</code> block runs when the condition is false.</p>`,
      code:`hp = 40
if hp > 50:
    print("Feeling strong")
else:
    print("Drink a potion")` },
    { h:'More choices with elif', p:`<p><code>elif</code> means "else if." Python checks each condition from top to bottom, runs the first one that is true, and skips the rest.</p>`,
      code:`score = 82
if score >= 90:
    print("Gold medal")
elif score >= 75:
    print("Silver medal")
else:
    print("Keep training")` }
  ],
  ex:{ title:'Fight or flight', prompt:`<p>If <code>hp</code> is below <code>30</code>, print <code>Retreat!</code>. Otherwise print <code>Attack!</code>. With <code>hp</code> set to 25, your program should print <code>Retreat!</code>.</p>`,
    starter:`hp = 25

`, check:{type:'output', expect:'Retreat!'},
    hints:[`Start with <code>if hp &lt; 30:</code> and indent the next line by 4 spaces.`,
           `Add <code>else:</code> on its own line with no indent, then an indented <code>print("Attack!")</code> below it.`],
    solution:`hp = 25

if hp < 30:
    print("Retreat!")
else:
    print("Attack!")` } },

{ id:'loops', title:'Loops', topic:'for / while', summary:'Repeat actions without copying and pasting code.',
  sections:[
    { h:'for loops', p:`<p>A <code>for</code> loop repeats a block of code. <code>range(5)</code> gives the numbers 0, 1, 2, 3 and 4. Each time around, the loop variable (here <code>i</code>) holds the next number.</p>`,
      code:`for i in range(5):

    { h:'Choosing the range', p:`<p><code>range(start, stop)</code> starts at <code>start</code> and stops just <strong>before</strong> <code>stop</code>. A third number sets the step, and a negative step counts down.</p>`,
      code:`for n in range(1, 4):
    print(n)

for n in range(10, 0, -3):
    print(n)` },
    { h:'while loops', p:`<p>A <code>while</code> loop keeps going as long as its condition is true. Make sure something inside the loop changes, or it will run forever.</p>`,
      code:`energy = 3
while energy > 0:
    print("Training... energy", energy)
    energy = energy - 1
print("Time to rest")` }
  ],
  ex:{ title:'Count the steps', prompt:`<p>Use a loop to print the numbers 1 to 5, each on its own line.</p>`,

`, check:{type:'output', expect:'1\n2\n3\n4\n5'},
    hints:[`<code>range(1, 6)</code> gives 1, 2, 3, 4, 5. The stop number is never included.`,

{ id:'lists', title:'Lists', topic:'[ ]', summary:'Keep many values together, in order.',

print(party)
print(party[0])
print(len(party))` },
    { h:'Changing a list', p:`<p><code>.append()</code> adds an item to the end. You can also replace an item by assigning a new value to its position.</p>`,
      code:`loot = ["coin", "gem"]
loot.append("map")
loot[0] = "gold coin"
print(loot)` },
    { h:'Looping over a list', p:`<p>A <code>for</code> loop can walk through a list directly. Each time around, the loop variable holds the next item.</p>`,
      code:`party = ["Ada", "Linus", "Grace"]

    print(f"{hero} joins the quest")` }
  ],
  ex:{ title:'Recruit a hero', prompt:`<p>Add <code>"Grace"</code> to the end of the <code>party</code> list, then print the whole list.</p>`,

`, check:{type:'output', expect:"['Ada', 'Linus', 'Grace']"},

{ id:'functions', title:'Functions', topic:'def / return', summary:'Package code into reusable moves with names.',
  sections:[
    { h:'Defining a function', p:`<p>A <strong>function</strong> is a named block of code you can run whenever you like. Create one with <code>def</code>, a name, parentheses and a colon. Nothing happens until you <strong>call</strong> it by writing its name followed by parentheses.</p>`,

  ex:{ title:'Double damage', prompt:`<p>Write a function called <code>double</code> that takes a number <code>n</code> and <strong>returns</strong> it multiplied by 2.</p>`,

    solution:`def double(n):

{ id:'dicts', title:'Dictionaries', topic:'{ key: value }', summary:'Look things up by name instead of by position.',
  sections:[
    { h:'Keys and values', p:`<p>A <strong>dictionary</strong> stores pairs. Each <strong>key</strong> points to a <strong>value</strong>, like a word and its definition. Use curly braces, with a colon between each key and its value.</p>`,

const XP_LESSON = 50, XP_DAILY = 10;
const XP_BY = { Easy:25, Medium:50, Hard:100 };
const LEVELS = [0, 100, 220, 360, 520, 700, 900, 1100];
const RANKS = ['Recruit','Apprentice','Squire','Knight','Champion','Warlord','Legend','Code Warrior'];
const MILESTONES = [3, 7, 14, 30, 60, 100];

/* ---------- icons ---------- */

const icon = (n, cls='') => `<svg class="i ${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]}</svg>`;

/* ---------- helpers ---------- */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const dayKey = (d=new Date()) => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseDay = k => { const [y,m,d] = k.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const plural = (n, w) => `${n} ${w}${n===1?'':'s'}`;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- state + persistence ---------- */
const LS_KEY = 'code-warrior.progress.v1';
const blank = () => ({ lessons:{}, challenges:{}, hints:{}, solutions:{}, drafts:{}, days:[], activity:[], updated:0 });
function normalize(s){
  const b = blank(); if (!s || typeof s !== 'object') return b;
  for (const k of ['lessons','challenges','hints','solutions','drafts']) if (s[k] && typeof s[k] === 'object' && !Array.isArray(s[k])) b[k] = s[k];
  if (Array.isArray(s.days)) b.days = s.days.filter(d => typeof d === 'string');
  if (Array.isArray(s.activity)) b.activity = s.activity.filter(a => a && typeof a.text === 'string');
  b.updated = +s.updated || 0;
  return b;
}
function merge(a, b){
  const o = blank();
  o.lessons = { ...a.lessons, ...b.lessons };
  for (const id of new Set([...Object.keys(a.challenges), ...Object.keys(b.challenges)])) {
    const x = a.challenges[id], y = b.challenges[id];
    o.challenges[id] = !x ? y : !y ? x : ((y.xp||0) > (x.xp||0) ? y : x);
  }
  for (const k of new Set([...Object.keys(a.hints), ...Object.keys(b.hints)])) o.hints[k] = Math.max(a.hints[k]||0, b.hints[k]||0);
  o.solutions = { ...a.solutions, ...b.solutions };
  o.drafts = (b.updated > a.updated) ? { ...a.drafts, ...b.drafts } : { ...b.drafts, ...a.drafts };
  o.days = [...new Set([...a.days, ...b.days])].sort().slice(-400);
  const seen = new Set();
  o.activity = [...a.activity, ...b.activity].filter(x => { const k = x.t + x.text; if (seen.has(k)) return false; seen.add(k); return true; })
    .sort((p, q) => q.t - p.t).slice(0, 20);
  o.updated = Math.max(a.updated, b.updated);
  return o;
}
function loadLocal(){ try { return normalize(JSON.parse(localStorage.getItem(LS_KEY))); } catch { return blank(); } }
function saveLocal(){ try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch {} }

let state = loadLocal();
let cloudDoc = null, writing = false, queued = false, saveTimer = null;

function persist(){
  state.updated = Date.now();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { saveLocal(); flushCloud(); }, 500);
}
async function flushCloud(){
  if (!cloudDoc) return;
  if (writing) { queued = true; return; }
  writing = true;
  try { await cloudDoc.set({ state: JSON.parse(JSON.stringify(state)) }); }
  catch (e) { if (e && ['invalid_argument','revoked','not_granted','capability_disabled'].includes(e.code)) { cloudDoc = null; setSync(false); } }
  writing = false;
  if (queued) { queued = false; flushCloud(); }
}
function setSync(cloud){
  $('#sync').textContent = cloud ? 'Progress is saved to your account, so it follows you to any device.' : 'Progress is saved in this browser.';
}
async function initCloud(){
  if (!window.claude || !window.claude.use) return;
  try {
    const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
    if (!db || !user) return;
    const id = await user.id();
    if (!id) return;
    const ref = db.doc('data/users/' + id + '/progress');
    const snap = await ref.get();
    cloudDoc = ref;
    if (snap.exists && snap.data() && snap.data().state) {
      state = merge(state, normalize(snap.data().state));
      checkIn(true);
      saveLocal();
      if (['home','lessons','challenges'].includes(route.view)) render(); else renderChrome();
    }
    setSync(true);
    persist();
  } catch { cloudDoc = null; }
}

/* ---------- derived numbers ---------- */
const doneLessons = () => LESSONS.filter(l => state.lessons[l.id]).length;
const doneChallenges = (diff) => CHALLENGES.filter(c => state.challenges[c.id] && (!diff || c.diff === diff)).length;
function totalXP(){
  let x = doneLessons() * XP_LESSON + state.days.length * XP_DAILY;
  for (const c of CHALLENGES) if (state.challenges[c.id]) x += state.challenges[c.id].xp || 0;
  return x;
}
function levelInfo(x){
  let i = 0; while (i + 1 < LEVELS.length && x >= LEVELS[i+1]) i++;
  return { level: i + 1, floor: LEVELS[i], next: LEVELS[i+1] ?? null, rank: RANKS[i], nextRank: RANKS[i+1] ?? null };
}
function streakInfo(){
  const set = new Set(state.days);
  let current = 0, d = new Date();
  if (!set.has(dayKey(d))) d = addDays(d, -1);
  while (set.has(dayKey(d))) { current++; d = addDays(d, -1); }
  let best = 0, run = 0, prev = null;
  for (const k of [...set].sort()) {
    const dt = parseDay(k);
    run = (prev && dayKey(addDays(prev, 1)) === k) ? run + 1 : 1;
    best = Math.max(best, run); prev = dt;
  }
  const today = new Date();
  const week = Array.from({length:7}, (_, i) => {
    const dt = addDays(today, i - 6);
    return { label: dt.toLocaleDateString(undefined, { weekday:'short' }).slice(0, 2).toUpperCase(), on: set.has(dayKey(dt)), today: i === 6 };
  });
  const next = MILESTONES.find(m => m > current) ?? null;
  return { current, best, week, next };
}
function rewardFor(ch){
  const base = XP_BY[ch.diff], k = 'c:' + ch.id;
  if (state.solutions[k]) return Math.round(base * 0.25);
  return Math.round(base * Math.max(0.4, 1 - 0.2 * (state.hints[k] || 0)));
}
function badges(){
  const s = streakInfo();
  const clean = CHALLENGES.some(c => c.diff !== 'Easy' && state.challenges[c.id] && !state.challenges[c.id].hints && !state.challenges[c.id].sol);
  return [
    { n:'First Steps', d:'Finish a lesson', i:'book', got: doneLessons() >= 1 },
    { n:'First Victory', d:'Clear a challenge', i:'sword', got: doneChallenges() >= 1 },
    { n:'On Fire', d:'3-day streak', i:'flame', got: s.best >= 3 },
    { n:'Unstoppable', d:'7-day streak', i:'bolt', got: s.best >= 7 },
    { n:'No Help Needed', d:'Clear a Medium or Hard with no hints', i:'target', got: clean },
    { n:'Heavy Hitter', d:'Clear a Hard challenge', i:'shield', got: doneChallenges('Hard') >= 1 },
    { n:'Scholar', d:'Finish every lesson', i:'star', got: doneLessons() === LESSONS.length },
    { n:'Champion', d:'Clear every challenge', i:'crown', got: doneChallenges() === CHALLENGES.length }
  ];
}
function addActivity(kind, text){
  state.activity.unshift({ t: Date.now(), kind, text });
  state.activity = state.activity.slice(0, 20);
}
function checkIn(silent){
  const k = dayKey();
  if (state.days.includes(k)) return false;
  state.days.push(k); state.days.sort(); state.days = state.days.slice(-400);
  const s = streakInfo();
  addActivity('streak', s.current > 1 ? `Checked in for day ${s.current} of your streak (+${XP_DAILY} XP)` : `Checked in for today (+${XP_DAILY} XP)`);
  persist();
  if (!silent) setTimeout(() => toast(icon('flame'), s.current > 1 ? `${s.current}-day streak! +${XP_DAILY} XP` : `Daily check-in +${XP_DAILY} XP`), 600);
  return true;
}

/* ---------- python runner (Skulpt) ---------- */
function runPython(code){
  return new Promise(resolve => {
    if (typeof Sk === 'undefined') { resolve({ ok:false, out:'', err:{ type:'Loading', msg:'The Python engine is still loading. Try again in a moment.' } }); return; }
    let out = '';
    Sk.configure({
      output: t => { out += t; },
      read: f => { if (Sk.builtinFiles === undefined || Sk.builtinFiles.files[f] === undefined) throw "File not found: '" + f + "'"; return Sk.builtinFiles.files[f]; },
      __future__: Sk.python3,
      execLimit: 5000,
      yieldLimit: 100,
      inputfunTakesPrompt: true,
      inputfun: p => { out += (p || '') + '\n'; return ''; }
    });
    Sk.misceval.asyncToPromise(() => Sk.importMainWithBody('<stdin>', false, code, true))
      .then(() => resolve({ ok:true, out }), e => resolve({ ok:false, out, err: formatErr(e) }));
  });
}
function formatErr(e){
  const raw = (e && e.toString) ? e.toString() : String(e);
  const m = raw.match(/^(\w+):\s*([\s\S]*?)(?:\s+on line (\d+))?\s*$/);
  let line = m && m[3] ? +m[3] : null;
  if (!line && e && e.traceback && e.traceback.length) line = e.traceback[0].lineno || null;
  return { type: m ? m[1] : 'Error', msg: m ? m[2] : raw, line };
}
const TIPS = {
  SyntaxError:'Python couldn\'t read this line. Look for a missing colon <code>:</code> at the end of an <code>if</code>, <code>for</code> or <code>def</code> line, a missing quote, or a bracket that was never closed.',
  IndentationError:'Code inside an <code>if</code>, <code>for</code>, <code>while</code> or <code>def</code> needs to be indented by 4 spaces, and lines in the same block need the same indent.',
  NameError:'Python doesn\'t know that name. Check the spelling, make sure you created it before using it, and remember that text needs quotes around it.',
  TypeError:'Two values of different types got mixed, like adding text to a number. <code>str()</code> turns a number into text and <code>int()</code> turns text into a number.',
  IndexError:'You asked for a position that doesn\'t exist. Positions start at 0, so the last item in a list of 3 is at position 2.',
  KeyError:'That key isn\'t in the dictionary. Check the spelling and the quotes.',
  ZeroDivisionError:'Something was divided by zero, which isn\'t allowed in math or in Python.',
  ValueError:'A value had the right type but the wrong content, like <code>int("abc")</code>.',
  AttributeError:'That value doesn\'t have the method you called. Check the spelling, like <code>.append()</code> or <code>.upper()</code>.',
  TimeLimitError:'Your code ran for too long. Check for a loop that never stops, like a <code>while</code> loop whose condition never becomes false.'
};
const norm = s => s.replace(/\r/g, '').split('\n').map(l => l.replace(/\s+$/, '')).join('\n').trim();

async function checkCode(item, code){
  for (const f of item.forbid || []) if (code.includes(f)) return { pass:false, out:'', note:`This challenge asks you to solve it without <code>${esc(f)})</code>. Try a loop instead.` };
  if (item.check.type === 'output') {
    const r = await runPython(code);
    if (!r.ok) return { pass:false, out:r.out, err:r.err };
    const got = norm(r.out), exp = norm(item.check.expect);
    return got === exp ? { pass:true, out:r.out } : { pass:false, out:r.out, diff:{ exp, got } };
  }
  const userLines = code.split('\n').length;
  const r = await runPython(code + '\n\n' + item.check.code);
  if (!r.ok) {
    if (r.err.type === 'AssertionError') return { pass:false, out:r.out, note:`A test didn't pass: ${esc(r.err.msg)}.` };
    if (r.err.line && r.err.line > userLines) r.err.line = null;
    return { pass:false, out:r.out, err:r.err };
  }
  return { pass:true, out:r.out };
}

/* ---------- code editor ---------- */
const KW = new Set('def return if elif else for while in not and or import from as class break continue pass lambda try except finally with is global'.split(' '));
const CONST = new Set(['True','False','None']);
const BUILTIN = new Set('print len range input int str float list dict sum max min abs round sorted type enumerate bool'.split(' '));
const TOK = /(#[^\n]*)|([fF]?(?:"(?:\\.|[^"\\\n])*"?|'(?:\\.|[^'\\\n])*'?))|(\b\d+(?:\.\d+)?\b)|([A-Za-z_]\w*)/g;
function hl(src){
  let out = '', last = 0;
  src.replace(TOK, (m, com, str, num, id, off) => {
    out += esc(src.slice(last, off)); last = off + m.length;
    if (com) out += `<span class="t-com">${esc(m)}</span>`;
    else if (str) out += `<span class="t-str">${esc(m)}</span>`;
    else if (num) out += `<span class="t-num">${m}</span>`;
    else if (KW.has(m)) out += `<span class="t-kw">${m}</span>`;
    else if (CONST.has(m)) out += `<span class="t-const">${m}</span>`;
    else if (BUILTIN.has(m)) out += `<span class="t-fn">${m}</span>`;
    else out += esc(m);
    return m;
  });
  return out + esc(src.slice(last));
}
const editors = {};
function makeEditor(host, key, code, { minLines = 3, onChange, onRun, label = 'Python code' } = {}){
  host.className = 'editor';
  host.innerHTML = `<div class="gutter" aria-hidden="true"></div><div class="code-wrap"><pre aria-hidden="true"><code></code></pre><textarea id="ed-${key}" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" wrap="off" aria-label="${esc(label)}"></textarea></div>`;
  const ta = $('textarea', host), pre = $('pre', host), codeEl = $('code', pre), gut = $('.gutter', host);
  codeEl.style.cssText = 'background:none;padding:0;color:inherit;font-size:inherit';
  ta.value = code;
  let escMode = false;
  const paint = () => {
    codeEl.innerHTML = hl(ta.value) + '\n';
    const n = ta.value.split('\n').length;
    gut.textContent = Array.from({ length: n }, (_, i) => i + 1).join('\n');
    ta.style.height = (Math.max(n, minLines) * 22.4 + 40) + 'px';
  };
  const insert = t => {
    ta.focus();
    const ok = t === '' ? document.execCommand('delete') : document.execCommand('insertText', false, t);
    if (!ok) { ta.setRangeText(t, ta.selectionStart, ta.selectionEnd, 'end'); ta.dispatchEvent(new Event('input')); }
  };
  ta.addEventListener('input', () => { paint(); onChange && onChange(ta.value); });
  ta.addEventListener('scroll', () => { pre.scrollLeft = ta.scrollLeft; });
  ta.addEventListener('keydown', e => {
    if (e.key === 'Escape') { escMode = true; return; }
    const wasEsc = escMode; escMode = false;
    const s = ta.selectionStart, v = ta.value, ls = v.lastIndexOf('\n', s - 1) + 1;
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); onRun && onRun(); return; }
    if (e.key === 'Tab' && !wasEsc) {
      e.preventDefault();
      if (e.shiftKey) { const k = (v.slice(ls).match(/^ {1,4}/) || [''])[0].length; if (k) { ta.setSelectionRange(ls, ls + k); insert(''); } }
      else insert('    ');
    } else if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      const line = v.slice(ls, s); let ind = line.match(/^ */)[0];
      if (/:\s*$/.test(line)) ind += '    ';
      insert('\n' + ind);
    } else if (e.key === 'Backspace' && s === ta.selectionEnd) {
      const before = v.slice(ls, s);
      if (before.length >= 4 && /^ +$/.test(before)) { e.preventDefault(); const k = before.length % 4 || 4; ta.setSelectionRange(s - k, s); insert(''); }
    }
  });
  paint();
  return { get: () => ta.value, set: val => { ta.value = val; paint(); onChange && onChange(val); }, focus: () => ta.focus() };
}

let toastTimer = null;
function toast(ic, text){

function confetti(){
  if (reduceMotion) return;
  const cv = $('#fx'), cx = cv.getContext('2d'), dpr = window.devicePixelRatio || 1;
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; cx.scale(dpr, dpr);
  const cs = getComputedStyle(document.documentElement);
  const cols = ['--coral','--sun','--cyan','--violet'].map(v => cs.getPropertyValue(v).trim());
  const ps = Array.from({ length: 120 }, () => ({
    x: innerWidth / 2 + (Math.random() - .5) * 120, y: innerHeight * .45,
    vx: (Math.random() - .5) * 16, vy: -Math.random() * 15 - 4, r: Math.random() * Math.PI,
    vr: (Math.random() - .5) * .4, w: 6 + Math.random() * 6, h: 3 + Math.random() * 4, c: cols[Math.floor(Math.random() * cols.length)]
  }));
  const t0 = performance.now();
  (function frame(now){
    const t = now - t0; cx.clearRect(0, 0, innerWidth, innerHeight);
    for (const p of ps) {
      p.vy += .45; p.vx *= .985; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r); cx.globalAlpha = Math.max(0, 1 - t / 1800);
      cx.fillStyle = p.c; cx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); cx.restore();
    }
    if (t < 1800) requestAnimationFrame(frame); else cx.clearRect(0, 0, innerWidth, innerHeight);
  })(t0);
}

  : `<div class="card"><h2>Nothing left here</h2><p class="dim">You've cleared every challenge in this group. Pick another filter to keep training.</p></div>`}`;
}

function rewardNote(ch){
  const k = 'c:' + ch.id, s = state.challenges[ch.id];
  if (s) return `Cleared for ${s.xp} XP. Solving it again can raise that to ${rewardFor(ch)} XP if it's higher.`;
  if (state.solutions[k]) return 'You viewed the solution, so this clear is worth 25%.';
  const n = state.hints[k] || 0;
  return n ? `${plural(n, 'hint')} used. Each hint lowers the reward by 20%, down to 40%.` : `Full reward with no hints. Each hint lowers it by 20%, down to 40%.`;
}
function renderChallenge(id){
  const ch = CHALLENGES.find(c => c.id === id);
  if (!ch) return go('challenges');
  ctx.cx = { kind:'challenge', id, item: ch, hk: 'c:' + id };
  closed.cx = new Set();
  view.innerHTML = `
  <div class="crumbs"><button class="link" data-go="challenges">${icon('left')} All challenges</button></div>
  <div class="ch-layout">
    <div class="ch-brief">
      <div class="eyebrow"><span class="pill d-${ch.diff}">${ch.diff}</span>${ch.tags.map(t => `<span class="tag">#${esc(t.replace(/\s/g, ''))}</span>`).join('')}</div>
      <h1>${ch.title}</h1>
      <div class="prose">${ch.prompt}</div>
      <div class="reward">${icon('bolt')}<div><strong id="reward-cx">${rewardFor(ch)} XP</strong><small id="reward-note">${rewardNote(ch)}</small></div></div>
    </div>
    <div class="ch-work">
      <div class="work-head"><span class="label">main.py</span><button class="link" data-reset="cx">${icon('reset')} Reset code</button></div>
      ${actionRow('cx', 'Submit')}
      <div class="term"><div data-ed="cx"></div><pre class="console" id="out-cx"><span class="dim">Press Run to try your code, or Submit when you think it's right. Output shows here.</span></pre></div>
      <div id="result-cx"></div>
      <div class="stuck-area"><div class="stuck-area" id="stuck-cx">${stuckHTML('cx')}</div><div id="coach-cx"></div></div>
    </div>
  </div>`;
  mount('cx', state.drafts['c:' + id] ?? ch.starter, { minLines: 10, label: 'Your solution', draft: 'c:' + id });
}

function mount(key, code, opts){
  const host = $(`[data-ed="${key}"]`);
  let t = null;
  editors[key] = makeEditor(host, key, code, {
    ...opts,
    onRun: () => runOnly(key),
    onChange: opts.draft ? v => { state.drafts[opts.draft] = v; clearTimeout(t); t = setTimeout(persist, 400); } : null
  });
}

/* ---------- actions ---------- */
function consoleHTML(out, err){
  let h = out ? esc(out) : '';
  if (err) {
    h += (h && !h.endsWith('\n') ? '\n' : '') + `<span class="err">${esc(err.type)}: ${esc(err.msg)}${err.line ? ` (line ${err.line})` : ''}</span>`;
    if (TIPS[err.type]) h += `<span class="tip"><b>Tip:</b> ${TIPS[err.type]}</span>`;
  } else if (!out) h = '<span class="dim">Your code ran but printed nothing. Use print() to show output.</span>';
  return h;
}
async function busy(key, fn){
  const btns = $$(`[data-run="${key}"],[data-check="${key}"]`);
  btns.forEach(b => b.disabled = true);
  try { await fn(); } finally { btns.forEach(b => b.disabled = false); }
}
async function runOnly(key){
  const ed = editors[key]; if (!ed) return;
  const out = $('#out-' + key);
  await busy(key, async () => {
    out.hidden = false; out.innerHTML = '<span class="dim">Running...</span>';
    const r = await runPython(ed.get());
    out.innerHTML = consoleHTML(r.out, r.ok ? null : r.err);
  });
}
async function doCheck(key){
  const c = ctx[key], ed = editors[key]; if (!c || !ed) return;
  const out = $('#out-' + key), res = $('#result-' + key);
  await busy(key, async () => {
    out.hidden = false; out.innerHTML = '<span class="dim">Checking...</span>'; res.innerHTML = '';
    const r = await checkCode(c.item, ed.get());
    out.innerHTML = r.note && !r.out ? '<span class="dim">No output.</span>' : consoleHTML(r.out, r.err);
    if (r.pass) {
      const gained = award(c);
      const nextBtn = c.kind === 'lesson'
        ? (() => { const i = LESSONS.findIndex(l => l.id === c.id), n = LESSONS[i + 1]; return n ? `<button class="btn btn-primary sm" data-lesson="${n.id}">Next lesson ${icon('right')}</button>` : `<button class="btn btn-primary sm" data-go="challenges">Go to challenges ${icon('right')}</button>`; })()
        : (() => { const n = CHALLENGES.find(x => !state.challenges[x.id]); return n ? `<button class="btn btn-primary sm" data-ch="${n.id}">Next challenge ${icon('right')}</button>` : `<button class="btn btn-primary sm" data-go="home">Back to base camp ${icon('right')}</button>`; })();
      res.innerHTML = `<div class="result win cut"><span class="ri">${icon('check')}</span><div class="rb"><strong>${c.kind === 'lesson' ? 'Lesson complete!' : 'Challenge cleared!'}</strong>
        <span class="xpg">${gained ? `+${gained} XP` : 'Already earned. Nice work solving it again.'}</span><div class="row">${nextBtn}</div></div></div>`;
      if (c.kind === 'lesson') $('#lx-status').innerHTML = `<span class="pill ok">${icon('check')} Completed</span>`;
      else { $('#reward-cx').textContent = rewardFor(c.item) + ' XP'; $('#reward-note').textContent = rewardNote(c.item); }
    } else {
      let body = '';
      if (r.diff) body = `Your output doesn't match yet.<div class="diff"><div><span class="label">Expected</span><pre>${esc(r.diff.exp)}</pre></div><div><span class="label">Your output</span><pre>${esc(r.diff.got) || '(nothing printed)'}</pre></div></div>`;
      else if (r.note) body = r.note;
      else body = 'Your code hit an error. The output below shows which line and a tip for fixing it.';
      res.innerHTML = `<div class="result miss"><span class="ri">${icon('x')}</span><div class="rb"><strong>Not quite yet</strong><div>${body}</div><div class="dim">Stuck? Press the yellow button for a hint.</div></div></div>`;
    }
  });
}
function award(c){
  const before = levelInfo(totalXP()).level;
  let gained = 0;
  if (c.kind === 'lesson') {
    if (!state.lessons[c.id]) {
      state.lessons[c.id] = Date.now(); gained = XP_LESSON;
      addActivity('lesson', `Finished the lesson "${LESSONS.find(l => l.id === c.id).title}" (+${gained} XP)`);
    }
  } else {
    const ch = c.item, prev = state.challenges[ch.id], r = rewardFor(ch);
    if (!prev || r > prev.xp) {
      gained = r - (prev ? prev.xp : 0);
      state.challenges[ch.id] = { xp: r, hints: state.hints[c.hk] || 0, sol: !!state.solutions[c.hk], at: Date.now() };
      addActivity('challenge', prev ? `Improved "${ch.title}" (+${gained} XP)` : `Cleared "${ch.title}" (+${gained} XP)`);
    }
  }
  const L = levelInfo(totalXP());
  if (L.level > before) {
    addActivity('level', `Reached Level ${L.level}: ${L.rank}`);
    setTimeout(() => toast(icon('crown'), `Level up! You're now a ${L.rank}`), 900);
  }
  if (gained) { persist(); confetti(); toast(icon('bolt'), `+${gained} XP`); }
  renderChrome();
  return gained;
}
function stuck(key, btn){
  const c = ctx[key], n = state.hints[c.hk] || 0, len = c.item.hints.length;
  if (n < len) state.hints[c.hk] = n + 1;
  else if (!state.solutions[c.hk]) {
    if (btn.dataset.confirm !== '1') {
      btn.dataset.confirm = '1';
      btn.innerHTML = c.kind === 'challenge' && !state.challenges[c.id]
        ? `${icon('bulb')} Sure? Reward drops to ${Math.round(XP_BY[c.item.diff] * 0.25)} XP`
        : `${icon('bulb')} Press again to see the answer`;
      return;
    }
    state.solutions[c.hk] = true;
  } else if (closed[key] && closed[key].size) closed[key].clear();
  else return;
  delete btn.dataset.confirm;
  persist();
  $('#stuck-' + key).innerHTML = stuckHTML(key);
  btn.innerHTML = stuckLabel(key);
  if (c.kind === 'challenge') { $('#reward-cx').textContent = rewardFor(c.item) + ' XP'; $('#reward-note').textContent = rewardNote(c.item); }
}
async function coach(key, btn){
  const c = ctx[key], ed = editors[key], box = $('#coach-' + key);
  if (!sampleFn || !c || !ed) return;
  const outEl = $('#out-' + key);
  const lastOut = outEl && !outEl.hidden ? outEl.textContent.slice(0, 1500) : '(not run yet)';
  const task = c.item.prompt ? c.item.prompt.replace(/<[^>]+>/g, '') : '';
  btn.disabled = true;
  box.innerHTML = `<div class="hint coach">${closeBtn(key, 'coach', 'Code Coach hint')}<span class="hint-n">${icon('chat')} Code Coach</span><div id="coach-text-${key}" class="dim">Reading your code...</div></div>`;
  const textEl = $('#coach-text-' + key);
  const prompt = `You are Code Coach inside Code Warrior, an app that teaches Python to complete beginners.
A student pressed "Ask Code Coach" because they are stuck.

Task they are working on:
${task}

Their current code:
${ed.get()}

Latest output or error from running it:
${lastOut}

Reply with ONE short, encouraging hint (at most 3 sentences, under 70 words) that points them to the next step.
If there is an error, explain in plain words what it means and where to look.
Do NOT write the full solution or a complete working program. You may show one tiny code fragment of at most one line.
Plain text only, no markdown headings or bullet lists.`;
  try {
    const r = await sampleFn(prompt, { modelTier: 'quick', cache: false, onText: ({ text }) => { textEl.classList.remove('dim'); textEl.textContent = text; } });
    textEl.classList.remove('dim'); textEl.textContent = r.text;
  } catch (e) {
    if (e && e.code === 'not_granted') { box.innerHTML = ''; $$('[data-coach]').forEach(b => b.hidden = true); sampleFn = null; }
    else textEl.textContent = e && e.code === 'rate_limited' ? 'Code Coach needs a short break. Try the yellow hint button, or ask again in a minute.' : 'Code Coach couldn\'t answer just now. The yellow hint button still works.';
  } finally { btn.disabled = false; }
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-go],[data-lesson],[data-ch],[data-filter],[data-run],[data-check],[data-stuck],[data-coach],[data-usesol],[data-reset],[data-close]');
  if (!t || t.disabled) return;
  const d = t.dataset;
  if (d.close) {
    if (d.idx === 'coach') $('#coach-' + d.close).innerHTML = '';
    else {
      (closed[d.close] || (closed[d.close] = new Set())).add(d.idx);
      $('#stuck-' + d.close).innerHTML = stuckHTML(d.close);
      $('#stuck-btn-' + d.close).innerHTML = stuckLabel(d.close);
    }
  }
  else if (d.go) go(d.go);
  else if (d.lesson) go('lesson', d.lesson);
  else if (d.ch) go('challenge', d.ch);
  else if (d.filter) { chFilter = d.filter; renderChallenges(); }
  else if (d.run) runOnly(d.run);
  else if (d.check) doCheck(d.check);
  else if (d.stuck) stuck(d.stuck, t);
  else if (d.coach) coach(d.coach, t);
  else if (d.usesol) { editors[d.usesol].set(ctx[d.usesol].item.solution); editors[d.usesol].focus(); }
  else if (d.reset) {
    if (t.dataset.confirm !== '1') { t.dataset.confirm = '1'; t.innerHTML = `${icon('reset')} Press again to reset`; setTimeout(() => { if (t.isConnected) { delete t.dataset.confirm; t.innerHTML = `${icon('reset')} Reset code`; } }, 3000); return; }
    delete t.dataset.confirm; t.innerHTML = `${icon('reset')} Reset code`;
    editors[d.reset].set(ctx[d.reset].item.starter);
  }
});

/* ---------- boot ---------- */
$$('[data-icon]').forEach(el => { el.outerHTML = icon(el.dataset.icon); });
$('#chip-st-i').outerHTML = icon('flame');
$('#chip-xp-i').outerHTML = icon('bolt');
const startHash = (location.hash || '').slice(1);
if (['home','lessons','challenges'].includes(startHash)) route = { view: startHash };
checkIn(false);
render();
initCloud();
if (window.claude && window.claude.use) {
  claude.use('sample').then(s => { sampleFn = s || null; $$('[data-coach]').forEach(b => b.hidden = !sampleFn); }).catch(() => {});
}
</script>

</body></html>
